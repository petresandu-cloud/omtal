# Layer: access. Can the machines that answer questions reach the site at all?
# Each rule names the fact it consumes and the check function that decides it.

[[rule]]
id = "access.home-answers"
layer = "access"
title = "The home page answers with HTML over HTTPS"
consumes = ["site.home"]
kind = "mechanical"
check = "home_answers"
severity = "fail"
why = "An engine that cannot fetch the front page cannot know the product exists. HTTPS is a ranking and trust signal on every engine."

[[rule]]
id = "access.robots-admits-ai-crawlers"
layer = "access"
title = "robots.txt admits the search and AI answer crawlers"
consumes = ["site.robots"]
kind = "mechanical"
check = "robots_admits"
severity = "fail"
why = "OpenAI states that sites must allow OAI-SearchBot to appear in ChatGPT search; Perplexity and Bing document their bots the same way. A Disallow: / for one of them is invisibility on that engine."

[[rule]]
id = "access.robots-present"
layer = "access"
title = "A robots.txt exists and names the sitemap"
consumes = ["site.robots"]
kind = "mechanical"
check = "robots_present"
severity = "risk"
why = "Absence is read as permission by most crawlers, but an explicit policy with a sitemap line is what OpenAI, Google and Bing ask for, and it is where a crawler finds the map."

[[rule]]
id = "access.sitemap"
layer = "access"
title = "A sitemap lists the pages"
consumes = ["site.sitemap"]
kind = "mechanical"
check = "sitemap_present"
severity = "risk"
why = "A sitemap is how a crawler learns about pages no link leads to yet, and how Bing and Google are told what changed."

[[rule]]
id = "access.llms-txt"
layer = "access"
title = "An llms.txt summarises the site for language models"
consumes = ["site.llms"]
kind = "mechanical"
check = "llms_present"
severity = "note"
why = "A convention rather than a standard: a plain-text summary at /llms.txt that several answer engines and agents read first. Cheap, and it is the one page written for the reader that matters here."

[[rule]]
id = "access.cdn-delivery"
layer = "access"
title = "No CDN in front rewrites the page into something worse for engines"
consumes = ["site.home", "site.pages"]
kind = "mechanical"
check = "cdn_delivery"
severity = "note"
why = "A CDN like Cloudflare serves the crawler its own edited copy of each page, not the server's. Most edits are harmless, but some — email-address obfuscation that turns a plain address into a dead /cdn-cgi/ link, managed robots.txt, script rewriting — change what an engine reads. Naming the edge, and the rewrites it made, tells the owner what is theirs to fix in code and what is a dashboard setting."

[[rule]]
id = "access.robots-one-group-per-bot"
layer = "access"
title = "robots.txt names each crawler in a single group"
consumes = ["site.robots"]
kind = "mechanical"
check = "robots_one_group_per_bot"
severity = "note"
why = "The robots.txt standard says a crawler obeys only the first group whose user-agent matches, and does not merge later groups for the same agent. When a CDN prepends its own 'User-agent: *' block ahead of the site's, a strict crawler reads the CDN's group and silently ignores the site's Disallow lines. Lenient crawlers merge and are fine; the split is the trap worth naming."

[[rule]]
id = "access.pages-crawlable"
layer = "access"
title = "The crawl reaches the pages the sitemap promises"
consumes = ["site.pages", "site.sitemap"]
kind = "mechanical"
check = "pages_crawlable"
severity = "risk"
why = "A sitemap that names pages returning errors, or pages blocked by a robots meta tag, tells an engine the map cannot be trusted."
